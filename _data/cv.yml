  sections:
    Research Interests:
      - label: AI-Native Wireless and Learning Systems
        details: Data-driven and physics-informed wireless channel modeling; generative waveform and neural transceiver design; learning-enabled PHY/MAC optimization for adaptive communication and sensing.
      - label: Wireless Intelligence and Edge Autonomy
        details: Multimodal data fusion for perception and communication; edge AI for real-time decision-making; trustworthy and energy-efficient communication in large-scale IoT and cyber-physical systems.
      - label: Experimental Systems and Prototyping
        details: Software-defined radio platforms, O-RAN testbeds, and AI-ready wireless datasets for validation and open research.

